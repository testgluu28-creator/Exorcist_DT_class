<style>
:root{
  --ground:#14171c; --panel:#1b1f26; --panel2:#232833; --hair:#2e3541;
  --ink:#d6dae1; --muted:#8b93a0;
  --combat:#b4553a; --mid:#7d6bb0; --support:#c8a44d;
  --on:#e9edf3; --wire:#39414f; --wire-on:#c8a44d;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:Barlow,system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}
aside{flex:0 0 300px;background:linear-gradient(180deg,#1b1f26,#161a20);border-right:1px solid var(--hair);
  padding:22px 20px;overflow-y:auto}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;margin:0 0 2px;letter-spacing:.01em}
.sub{font-family:'Barlow Condensed',sans-serif;color:var(--muted);font-size:14px;margin-bottom:20px;letter-spacing:.04em}
.budget{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.budget b{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;line-height:1}
.budget span{color:var(--muted);font-size:14px}
.bar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin:10px 0 22px}
.bar i{display:block;height:100%;background:var(--support);width:0;transition:width .18s}
h2{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.12em;
  color:var(--muted);margin:22px 0 9px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid #232833}
.row em{font-style:normal;color:var(--muted)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:middle}
.slots{display:flex;gap:6px;margin-top:8px}
.slot{flex:1;text-align:center;padding:8px 4px;border:1px solid var(--hair);border-radius:3px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.slot.on{border-color:var(--support);color:var(--support)}
button{width:100%;margin-top:20px;padding:10px;background:transparent;border:1px solid var(--hair);
  color:var(--muted);border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:13px;
  letter-spacing:.1em;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--support);color:var(--support)}
main{flex:1;position:relative;overflow:auto}
svg{display:block;margin:0 auto}
.band text{font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:.22em;
  text-transform:uppercase;opacity:.5}
.wire{stroke:var(--wire);stroke-width:1.6}
.wire.live{stroke:var(--wire-on);stroke-width:2.2}
.nd{cursor:pointer}
.nd .hit{fill:transparent}
.nd .bg{fill:var(--panel2);stroke:var(--wire);stroke-width:1.6;transition:fill .12s,stroke .12s}
.nd.avail .bg{stroke:#5b6577}
.nd.on .bg{stroke-width:2.4}
.nd.combat.on .bg{fill:#3a2119;stroke:var(--combat)}
.nd.mid.on .bg{fill:#251f38;stroke:var(--mid)}
.nd.support.on .bg{fill:#332a15;stroke:var(--support)}
.nd .lbl{font-family:'Barlow Condensed',sans-serif;font-size:10.5px;fill:var(--muted);text-anchor:middle}
.nd.on .lbl{fill:var(--on)}
.nd.dim{opacity:.22}
#tip{position:fixed;pointer-events:none;max-width:300px;background:#0f1216;border:1px solid var(--hair);
  border-left:3px solid var(--wire);padding:11px 13px;border-radius:3px;opacity:0;transition:opacity .1s;
  box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:9}
#tip.combat{border-left-color:var(--combat)} #tip.mid{border-left-color:var(--mid)} #tip.support{border-left-color:var(--support)}
#tip h3{margin:0 0 3px;font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600}
#tip .tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.09em;color:var(--muted);margin-bottom:7px}
#tip p{margin:0;font-size:13.5px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Exorcist talent tree">`;
  bands.forEach(([x0,x1,c,lab])=>{
    s+=`<rect x="${x0}" y="0" width="${x1-x0}" height="${H}" fill="var(--${c})" opacity="0.035"/>`;
    s+=`<g class="band"><text x="${(x0+x1)/2}" y="34" text-anchor="middle" fill="var(--${c})">${lab}</text></g>`;
  });
  E.forEach(([a,b],i)=>{
    s+=`<line class="wire" id="w${i}" x1="${N[a].x+PAD}" y1="${N[a].y}" x2="${N[b].x+PAD}" y2="${N[b].y}"/>`;
  });
  N.forEach((n,i)=>{
    const r=SH[n.type]||13, sq=['keystone','ability','blitz','aura','root'].includes(n.type);
    const shape = sq
      ? `<rect class="bg" x="${n.x+PAD-r}" y="${n.y-r}" width="${2*r}" height="${2*r}" rx="3"/>`
      : `<circle class="bg" cx="${n.x+PAD}" cy="${n.y}" r="${r}"/>`;
    s+=`<g class="nd ${n.region}" id="n${i}" tabindex="0" role="button" aria-label="${n.name}">
      ${shape}
      <circle class="hit" cx="${n.x+PAD}" cy="${n.y}" r="${r+8}"/>
      <text class="lbl" x="${n.x+PAD}" y="${n.y+r+13}">${n.name}</text></g>`;
  });
  document.getElementById('host').innerHTML=s+'</svg>';
  svg=document.querySelector('svg');
  N.forEach((n,i)=>{
    const g=document.getElementById('n'+i);
    g.addEventListener('click',()=>toggle(i));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(i)}});
    g.addEventListener('mouseenter',e=>show(e,n));
    g.addEventListener('mousemove',e=>place(e));
    g.addEventListener('mouseleave',()=>{tip.style.opacity=0});
    g.addEventListener('focus',e=>show({clientX:g.getBoundingClientRect().right,clientY:g.getBoundingClientRect().top},n));
    g.addEventListener('blur',()=>{tip.style.opacity=0});
  });
  const tags=[...new Set(N.map(n=>n.tag))].sort();
  document.getElementById('filt').innerHTML='<option value="">none</option>'+tags.map(t=>`<option>${t}</option>`).join('');
  paint();
}
function toggle(i){
  if(i===0)return;
  if(owned.has(i)){ if(connectedWithout(i)){owned.delete(i);paint()} return }
  if(owned.size-1>=30) return;
  if(avail(i)){owned.add(i);paint()}
}
function show(e,n){
  tip.className=n.region;
  tip.innerHTML=`<h3>${n.name}</h3><div class="tag">${n.tag} &middot; ${n.type}</div><p>${n.desc}</p>`;
  tip.style.opacity=1; place(e);
}
function place(e){
  const r=tip.getBoundingClientRect();
  let x=e.clientX+16,y=e.clientY+16;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-16;
  if(y+r.height>innerHeight-8)y=innerHeight-r.height-8;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function paint(){
  const sp=owned.size-1;
  document.getElementById('spent').textContent=sp;
  document.getElementById('fill').style.width=(100*sp/30)+'%';
  const reg={combat:0,mid:0,support:0};
  owned.forEach(i=>{if(i)reg[N[i].region]++});
  for(const k in reg)document.getElementById('r-'+k).textContent=reg[k];
  let pts=0; owned.forEach(i=>{if(i&&(N[i].tag==='incantation_slot_point'||N[i].type==='support_keystone'||(N[i].region==='support'&&['blitz','aura','ability','keystone'].includes(N[i].type))))pts++});
  document.getElementById('s2').className='slot'+(pts>=2?' on':'');
  document.getElementById('s3').className='slot'+(pts>=4?' on':'');
  N.forEach((n,i)=>{
    const g=document.getElementById('n'+i);
    g.classList.toggle('on',owned.has(i));
    g.classList.toggle('avail',!owned.has(i)&&avail(i));
    g.classList.toggle('dim',!!filt&&n.tag!==filt);
  });
  E.forEach(([a,b],i)=>document.getElementById('w'+i).classList.toggle('live',owned.has(a)&&owned.has(b)));
}
document.getElementById('reset').onclick=()=>{owned.clear();owned.add(0);paint()};
document.getElementById('filt').onchange=e=>{filt=e.target.value;paint()};
build();
</script></body></html>
